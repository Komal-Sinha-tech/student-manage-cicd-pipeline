name: Student Management System CI

on: push: branches: [main, master] pullrequest: branches: [main, master] workflowdispatch:

jobs: test: runs-on: ubuntu-latest

steps: - name: Checkout Repository uses: actions/checkout@v4

- name: Setup Python uses: actions/setup-python@v5 with: python-version: "3.11"

- name: Install Dependencies run: | python -m pip install --upgrade pip python -m pip install -r requirements.txt

- name: Run Tests run: python -m pytest -v --cov=.

